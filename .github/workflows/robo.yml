# Robô Tartaruga na nuvem do GitHub, de graça, com a máquina do dono desligada.
# Roda uma vez por dia logo depois do fechamento diário (00:00 UTC). Só modo SIMULADO: os servidores do GitHub ficam nos EUA,
# onde a api.binance.com é bloqueada; os dados públicos vêm de data-api.binance.vision.
# O estado fica no ramo `estado` (separado do código). Avisos: Telegram, se os segredos existirem; sempre no resumo do Actions.
name: robo-diario

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: estado          # um fluxo de cada vez grava no ramo estado
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Testes
        run: python -m unittest tests.test_baleias

      - name: Buscar o estado (ramo estado, sem apagar o que os outros fluxos gravaram)
        run: |
          git fetch origin estado
          git worktree add estado origin/estado
          cd estado && git switch -q -c trabalho

      - name: Rodada do dia
        env:
          BALEIAS_DADOS: ${{ github.workspace }}/estado/dados
          BINANCE_BASE: https://data-api.binance.vision
          BINANCE_DADOS: https://data-api.binance.vision
        run: |
          set -o pipefail
          python -m executor.diario | tee resumo.txt
          { echo '```'; cat resumo.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Robô-sombra com teto de 6 posições (H13, validação ao vivo)
        continue-on-error: true
        env:
          BALEIAS_DADOS: ${{ github.workspace }}/estado/dados/teto6
          BINANCE_BASE: https://data-api.binance.vision
          BINANCE_DADOS: https://data-api.binance.vision
          TARTARUGA_MAX_POSICOES: "6"
        run: |
          mkdir -p "$BALEIAS_DADOS"
          python -m executor.diario | tee resumo_teto6.txt
          { echo '### Robô-sombra (teto 6)'; echo '```'; cat resumo_teto6.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar o estado
        run: |
          cd estado
          git config user.name "robo-baleias"
          git config user.email "robo-baleias@users.noreply.github.com"
          for f in dados/robo_tartaruga.json dados/robo_eventos.jsonl dados/teto6/robo_tartaruga.json dados/teto6/robo_eventos.jsonl; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -q -m "robô diário $(date -u +%F)" || exit 0
          for i in 1 2 3; do git push -q origin HEAD:estado && exit 0; git fetch -q origin estado && git rebase -q origin/estado; done
          exit 1

      - name: Avisar no Telegram
        if: always()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TOKEN" ] || [ -z "$CHAT" ] && { echo "Telegram não configurado"; exit 0; }
          [ -f resumo.txt ] || echo "⚠️ A rodada do robô falhou. Veja o GitHub Actions." > resumo.txt
          curl -s -o /dev/null -w "telegram %{http_code}\n" "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" --data-urlencode "text@resumo.txt"
