# Cérebro de day trade na nuvem do GitHub (repositório público = minutos ilimitados).
# O agendador gratuito do GitHub atrasa/pula horários, então cada rodada fica viva por até ~5h50 pensando a cada 15 min;
# o agendamento de hora em hora só acorda uma rodada nova quando a anterior acabou (fila própria, não bloqueia o robô diário).
name: cerebro

on:
  schedule:
    - cron: "7,27,47 * * * *"     # a cada 20 min: se uma rodada já está viva a nova fica na fila; assim o intervalo entre rodadas fica curto
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write        # 23/11: a rodada dispara a seguinte (o agendador do GitHub deixou 3h20 e 2h sem rodada)

concurrency:
  group: cerebro
  cancel-in-progress: false

jobs:
  pensar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Bibliotecas do Cérebro v4 (LightGBM)
        run: pip install -q numpy lightgbm

      - name: Recuperar os cérebros das outras moedas (cache grátis do Actions)
        uses: actions/cache/restore@v4
        with:
          path: cerebros_moedas
          key: cerebros-${{ github.run_id }}
          restore-keys: cerebros-

      - name: Pensar a cada 15 min por até ~5h40
        env:
          BINANCE_DADOS: https://data-api.binance.vision
          CEREBROS_MOEDAS: ${{ github.workspace }}/cerebros_moedas
          TOKEN_TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_TG: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config --global user.name "cerebro-baleias"
          git config --global user.email "cerebro-baleias@users.noreply.github.com"
          fim=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$fim" ]; do
            rm -rf estado && git worktree prune
            git fetch -q origin estado
            git worktree add -q -f estado origin/estado && (cd estado && git switch -q -C trabalho)
            # H68 (19/11): o Caçador varre o universo em paralelo às outras etapas (só grava dados/oportunidades.json; limite de 150 s)
            (BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" timeout 150 python -m executor.cacador_nuvem > cacador.log 2>&1 || echo "caçador falhou" >> cacador.log) &
            CACADOR=$!
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" python -m executor.cerebro_nuvem | tee -a resumo.txt || echo "rodada falhou"
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" python -m executor.cerebro_v4_nuvem | tee -a resumo.txt || echo "v4 falhou"
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" python -m executor.vigia_v4 | tee -a resumo.txt || echo "vigia falhou"
            # 18/11 (dono): quem opera são os agentes do OpenBot; os robôs (Rápido, Caçador, Scalpers, Minerador, LBank, Livre) saíram do laço
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" python -m executor.carteiras_nuvem | tee -a resumo.txt || echo "carteiras falhou"   # H63: monitor fomo
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" python -m executor.robo_claude_nuvem | tee -a resumo.txt || echo "robô claude falhou"
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" RC_AGENTE=treinador RC_ARQ=agente_treinador.json RC_DECISAO=decisao_treinador.json RC_NOME="Treinador" python -m executor.robo_claude_nuvem | tee -a resumo.txt || echo "agente treinador falhou"
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" RC_AGENTE=laboratorio RC_ARQ=agente_laboratorio.json RC_DECISAO=decisao_laboratorio.json RC_NOME="Laboratório" python -m executor.robo_claude_nuvem | tee -a resumo.txt || echo "agente laboratorio falhou"
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" RC_AGENTE=guardiao RC_ARQ=agente_guardiao.json RC_DECISAO=decisao_guardiao.json RC_NOME="Guardião" python -m executor.robo_claude_nuvem | tee -a resumo.txt || echo "agente guardiao falhou"
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" python -m executor.torneio | tee -a resumo.txt || echo "torneio falhou"
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" python -m executor.banco | tee -a resumo.txt || echo "banco falhou"
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" python -m executor.mercado_agora | tee -a resumo.txt || echo "retrato falhou"
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" python -m executor.licoes | tee -a resumo.txt || echo "lições falhou"
            wait $CACADOR; cat cacador.log | tee -a resumo.txt
            (
              # Salva SÓ os arquivos deste fluxo por cima do estado mais novo do ramo (outro fluxo, o testnet, também escreve no ramo a cada
              # 5 min; o rebase antigo falhava e 15 rodadas seguidas perderam o estado em 13–14/11). Nunca toca nos arquivos dos outros.
              cd estado
              MEUS="dados/oportunidades.json dados/carteiras_top.json dados/agente_treinador.json dados/agente_laboratorio.json dados/agente_guardiao.json dados/banco.json dados/robo_lbank.json dados/foco_scalper.json dados/robo_scalper_d.json dados/torneio.json dados/robo_scalper_b.json dados/robo_scalper_c.json dados/robo_livre.json dados/vigia_v4.json dados/sala.json dados/ordens.json dados/cerebro.json dados/cerebro_v2.json dados/cerebro_v3.json dados/livro_metodos.json dados/LIVRO_DE_METODOS.md dados/cerebros_moedas.json dados/robo_minerador.json dados/cerebro_v4.json dados/robo_v4_perp.json dados/robo_v4_cacador.json dados/LICOES.md dados/mercado_agora.json dados/robo_claude.json dados/robo_scalper_nuvem.json"
              rm -rf ../salvo && mkdir -p ../salvo && for f in $MEUS; do [ -f "$f" ] && cp --parents "$f" ../salvo/; done
              for i in 1 2 3 4 5; do
                git fetch -q origin estado && git reset -q --hard origin/estado && cp -r ../salvo/. .
                for f in $MEUS; do [ -f "$f" ] && git add "$f"; done
                if git diff --cached --quiet; then echo "estado: nada novo"; break; fi
                git commit -q -m "cérebro $(date -u +%FT%H:%M)"
                if git push -q origin HEAD:estado; then echo "estado salvo ($(git rev-parse --short HEAD))"; break; fi
                echo "push rejeitado, tentativa $i"; sleep $((i * 5))
              done
            )
            if [ -n "$TOKEN_TG" ] && [ -n "$CHAT_TG" ] && [ -f estado/avisos.txt ]; then
              curl -s -o /dev/null "https://api.telegram.org/bot${TOKEN_TG}/sendMessage" --data-urlencode "chat_id=${CHAT_TG}" --data-urlencode "text@estado/avisos.txt"
            fi
            # pedido do dono (16/11): a decisão não espera vela de 15 min — a rodada seguinte começa 1 min depois desta terminar
            sleep 60
          done
          { echo '```'; tail -40 resumo.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar os cérebros das outras moedas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cerebros_moedas
          key: cerebros-${{ github.run_id }}

      # 23/11 (auditoria): o agendador grátis do GitHub pulou horas (11:03 → 14:23 UTC e 20:05 → 22:00 UTC sem rodada; decisões sem aplicar).
      # Cada rodada acorda a próxima; a fila "cerebro" segura só uma pendente, então o agendamento e este disparo não se somam.
      - name: Acordar a próxima rodada
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cerebro.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" || echo "não consegui disparar a próxima rodada"
