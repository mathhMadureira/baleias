# Cérebro de day trade na nuvem do GitHub (repositório público = minutos ilimitados).
# O agendador gratuito do GitHub atrasa/pula horários, então cada rodada fica viva por até ~5h50 pensando a cada 15 min;
# o agendamento de hora em hora só acorda uma rodada nova quando a anterior acabou (fila própria, não bloqueia o robô diário).
name: cerebro

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cerebro
  cancel-in-progress: false

jobs:
  pensar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Bibliotecas do Cérebro v4 (LightGBM)
        run: pip install -q numpy lightgbm

      - name: Recuperar os cérebros das outras moedas (cache grátis do Actions)
        uses: actions/cache/restore@v4
        with:
          path: cerebros_moedas
          key: cerebros-${{ github.run_id }}
          restore-keys: cerebros-

      - name: Pensar a cada 15 min por até ~5h40
        env:
          BINANCE_DADOS: https://data-api.binance.vision
          CEREBROS_MOEDAS: ${{ github.workspace }}/cerebros_moedas
          TOKEN_TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_TG: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config --global user.name "cerebro-baleias"
          git config --global user.email "cerebro-baleias@users.noreply.github.com"
          fim=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$fim" ]; do
            rm -rf estado && git worktree prune
            git fetch -q origin estado
            git worktree add -q -f estado origin/estado && (cd estado && git switch -q -C trabalho)
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" python -m executor.cerebro_nuvem | tee -a resumo.txt || echo "rodada falhou"
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" python -m executor.minerador_nuvem | tee -a resumo.txt || echo "minerador falhou"
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" python -m executor.cerebro_v4_nuvem | tee -a resumo.txt || echo "v4 falhou"
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" python -m executor.v4_perp_nuvem | tee -a resumo.txt || echo "rápido nuvem falhou"
            BALEIAS_DADOS="$GITHUB_WORKSPACE/estado/dados" V4P_LIMIAR=0.12 V4P_ARQ=robo_v4_perp_seletivo.json V4P_NOME="Rápido nuvem seletivo" python -m executor.v4_perp_nuvem | tee -a resumo.txt || echo "rápido nuvem seletivo falhou"
            (
              cd estado
              for f in dados/cerebro.json dados/cerebro_v2.json dados/cerebro_v3.json dados/livro_metodos.json dados/LIVRO_DE_METODOS.md dados/cerebros_moedas.json dados/robo_minerador.json dados/cerebro_v4.json dados/robo_v4_perp.json dados/robo_v4_perp_seletivo.json; do [ -f "$f" ] && git add "$f"; done
              git commit -q -m "cérebro $(date -u +%FT%H:%M)" && for i in 1 2 3 4; do git push -q origin HEAD:estado && break; git fetch -q origin estado && git rebase -q origin/estado; done
            )
            if [ -n "$TOKEN_TG" ] && [ -n "$CHAT_TG" ] && [ -f estado/avisos.txt ]; then
              curl -s -o /dev/null "https://api.telegram.org/bot${TOKEN_TG}/sendMessage" --data-urlencode "chat_id=${CHAT_TG}" --data-urlencode "text@estado/avisos.txt"
            fi
            # dorme até 2 min depois do próximo fechamento de vela de 15 min
            agora=$(date +%s); prox=$(( (agora / 900 + 1) * 900 + 120 )); sleep $(( prox - agora ))
          done
          { echo '```'; tail -40 resumo.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar os cérebros das outras moedas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cerebros_moedas
          key: cerebros-${{ github.run_id }}
