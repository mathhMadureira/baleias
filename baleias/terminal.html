<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baleias — terminal</title>
<style>
/* 27/11 (dono: "vá atrás de um painel novo na web"): layout de terminal de trading — gráfico de velas no centro
   (TradingView Lightweight Charts, Apache-2.0, guardado em /static), posições e operações embaixo, equipe e conversa ao lado.
   Uma tela só: sem abas, sem rolagem da página. */
:root{--bg:#07090c;--p:#0d1117;--p2:#11161d;--b:#1c232c;--t:#e6edf3;--f:#7d8792;--g:#2ee59d;--r:#ff5370;--y:#ffcb6b;--a:#5aa9ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t);font:12.5px/1.35 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:grid;grid-template-rows:46px 1fr;height:100dvh}
.n{font-variant-numeric:tabular-nums}.g{color:var(--g)}.r{color:var(--r)}.f{color:var(--f)}.y{color:var(--y)}
/* barra de cima */
.top{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--b);background:var(--p);overflow:hidden}
.marca{display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:800;font-size:15px;height:100%;border-right:1px solid var(--b)}
.marca i{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g)}
.kpi{padding:0 14px;height:100%;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--b);min-width:0;white-space:nowrap}
.kpi s{text-decoration:none;color:var(--f);font-size:10.5px}
.kpi b{font-size:14px;font-weight:700}
.kpi em{font-style:normal;font-size:11px;margin-left:5px}
.top .fim{margin-left:auto;padding:0 14px;color:var(--f);font-size:11px;text-align:right}
/* grade principal */
.grade{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(300px,1fr);grid-template-rows:minmax(0,1fr) minmax(0,.62fr);min-height:0}
.pn{background:var(--p);border-right:1px solid var(--b);border-bottom:1px solid var(--b);min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column}
.cab{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--b);background:var(--p2);font-size:11px;color:var(--f);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden}
.cab .dir{margin-left:auto;text-transform:none;letter-spacing:0}
.corpo{flex:1;min-height:0;overflow:hidden;position:relative}
/* gráfico */
#grafico{grid-column:1;grid-row:1}
.chips{display:flex;gap:6px;overflow:hidden;text-transform:none;letter-spacing:0}
.chip{border:1px solid var(--b);border-radius:6px;padding:2px 8px;color:var(--t);cursor:pointer;background:var(--p);font-size:11.5px}
.chip.on{border-color:var(--a);color:var(--a)}
.chip small{margin-left:4px}
.ivs{display:flex;gap:2px}
.iv{padding:2px 6px;border-radius:4px;cursor:pointer;color:var(--f)}.iv.on{background:#1b2633;color:var(--t)}
#cg{position:absolute;inset:0}
.leg{position:absolute;left:10px;top:8px;z-index:3;pointer-events:none;font-size:12px}
.leg b{font-size:16px;margin-right:8px}
.leg .ln{display:flex;gap:12px;margin-top:2px;font-size:11px}
/* baixo esquerda: posições + operações */
#baixo{grid-column:1;grid-row:2;display:grid;grid-template-columns:1fr 1fr;border-bottom:0}
#baixo>div{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--b)}
#baixo table{width:100%;border-collapse:collapse;table-layout:fixed}
#baixo th{position:sticky;top:0;background:var(--p);color:var(--f);font-weight:500;font-size:10.5px;text-align:left;padding:4px 8px;border-bottom:1px solid var(--b)}
#baixo td{padding:4px 8px;border-bottom:1px solid #141a21;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#baixo td.d,#baixo th.d{text-align:right}
#baixo tr.click{cursor:pointer}#baixo tr.click:hover td{background:#121922}
.lado{font-size:10px;padding:1px 5px;border-radius:4px}
.lado.c{background:#0f2e22;color:var(--g)}.lado.v{background:#3a1520;color:var(--r)}
.vazio{padding:12px;color:var(--f)}
/* coluna direita */
#lado{grid-column:2;grid-row:1 / span 2;display:grid;grid-template-rows:minmax(0,.55fr) minmax(0,1.25fr) minmax(0,1fr);border-right:0;border-bottom:0}
#lado>section{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid var(--b)}
#ce{position:absolute;inset:0}
.ag{display:grid;grid-template-columns:18px 22px 1fr auto;gap:6px;align-items:center;padding:5px 10px;border-bottom:1px solid #141a21}
.ag .dot{width:7px;height:7px;border-radius:50%;background:#3a434d;justify-self:center}
.ag .dot.on{background:var(--g);box-shadow:0 0 6px var(--g)}
.ag .av{font-size:15px}
.ag .tx{min-width:0}
.ag .tx b{font-size:12px}
.ag .tx .ul{display:block;color:var(--f);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag .q{color:var(--f);font-size:10.5px;text-align:right;white-space:nowrap}
.cf{font-size:9.5px;padding:0 5px;border-radius:999px;border:1px solid var(--b);margin-left:4px;font-weight:500}
.cf.alta{color:var(--g);border-color:#1d4a37}.cf.média{color:var(--y);border-color:#4a3d1d}
.msg{padding:4px 10px;border-bottom:1px solid #141a21;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .h{color:var(--f);font-size:10.5px;margin-right:6px}
.msg b{font-weight:600}
@media (max-width:900px){
  body{grid-template-rows:auto 1fr}
  .top{flex-wrap:wrap;height:auto}.marca,.top .fim{display:none}
  .kpi{flex:1 1 33%;padding:4px 8px;border-bottom:1px solid var(--b)}
  .grade{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,.55fr) minmax(0,.9fr)}
  #grafico{grid-row:1}#baixo{grid-row:2;grid-column:1}
  #lado{grid-column:1;grid-row:3;grid-template-rows:0 minmax(0,1fr) minmax(0,.8fr)}
  #lado>section:first-child{display:none}
  #baixo>div:last-child{display:none}#baixo{grid-template-columns:1fr}
}
</style>
<script src="/static/lightweight-charts-5.0.8.js"></script>
</head>
<body>
<div class="top">
  <div class="marca"><i></i>Baleias</div>
  <div class="kpi"><s>BTC</s><div><b class="n" id="btc">—</b><em id="btcv"></em></div></div>
  <div class="kpi"><s>BingX · demonstração</s><div><b class="n" id="kb">—</b><em id="kbv"></em></div></div>
  <div class="kpi"><s>pump.fun · papel</s><div><b class="n" id="kp">—</b><em id="kpv"></em></div></div>
  <div class="kpi"><s>Total (início US$ 20)</s><div><b class="n" id="kt">—</b><em id="ktv"></em></div></div>
  <div class="kpi"><s>24 h</s><div><b class="n" id="k24">—</b><em id="k24v"></em></div></div>
  <div class="kpi"><s id="kms">Motor</s><div><b id="km">—</b></div></div>
  <div class="fim" id="hora"></div>
</div>
<div class="grade">
  <div class="pn" id="grafico">
    <div class="cab"><div class="chips" id="chips"></div>
      <div class="dir ivs" id="ivs"><span class="iv" data-i="1m">1m</span><span class="iv on" data-i="5m">5m</span><span class="iv" data-i="15m">15m</span><span class="iv" data-i="1h">1h</span><span class="iv" data-i="4h">4h</span></div></div>
    <div class="corpo"><div class="leg" id="leg"></div><div id="cg"></div></div>
  </div>
  <div class="pn" id="baixo">
    <div><div class="cab">Posições abertas <span class="dir" id="npos"></span></div><div class="corpo" id="lpos"></div></div>
    <div><div class="cab">Últimas operações <span class="dir" id="placar"></span></div><div class="corpo" id="lfe"></div></div>
  </div>
  <div class="pn" id="lado">
    <section id="curva"><div class="cab">Carteiras <span class="dir"><span class="g">■</span> BingX &nbsp;<span style="color:#ff9e64">■</span> pump.fun</span></div><div class="corpo"><div id="ce"></div></div></section>
    <section><div class="cab">Equipe <span class="dir" id="nag"></span></div><div class="corpo" id="lag"></div></section>
    <section><div class="cab">Conversa</div><div class="corpo" id="lcanal"></div></section>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const j = async u => (await fetch(u, {cache: "no-store"})).json();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd = v => (v == null || isNaN(v)) ? "—" : (v < 0 ? "−" : "") + "$" + Math.abs(v).toFixed(2);
const sin = (v, d = 2) => (v == null || isNaN(v)) ? "—" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d);
const cl = v => v > 0 ? "g" : v < 0 ? "r" : "f";
const hm = t => t ? new Date(t * 1000).toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"}) : "";
const ha = t => { if (!t) return ""; const s = Date.now() / 1000 - t; return s < 90 ? "agora" : s < 3600 ? Math.round(s / 60) + "m" : s < 86400 ? Math.round(s / 3600) + "h" : Math.round(s / 86400) + "d"; };
const px = v => v == null ? "—" : v >= 1000 ? v.toLocaleString("pt-BR", {maximumFractionDigits: 1}) : v >= 1 ? v.toFixed(4) : v.toPrecision(4);
const PAPEL = {laboratorio: "decide na BingX · 3 min", memecoins: "decide na pump.fun · 3 min", cacador: "ideias · por evento", guardiao: "risco · por evento",
  treinador: "lições · por evento", engenheiro: "saúde · por evento", minerador: "ganhos grátis · diário", baleias: "chefe do sistema"};
const LW = window.LightweightCharts;
const tema = {layout: {background: {type: "solid", color: "#0d1117"}, textColor: "#7d8792", fontSize: 11, attributionLogo: true},
  grid: {vertLines: {color: "#141a21"}, horzLines: {color: "#141a21"}}, rightPriceScale: {borderColor: "#1c232c"}, leftPriceScale: {visible: false},
  timeScale: {borderColor: "#1c232c", timeVisible: true, secondsVisible: false}, crosshair: {mode: 0}};

// ---------- gráfico de velas da moeda escolhida, com entrada, stop e alvo ----------
const cg = LW.createChart($("cg"), {...tema, autoSize: true, localization: {locale: "pt-BR"}});
const velas = cg.addSeries(LW.CandlestickSeries, {upColor: "#2ee59d", downColor: "#ff5370", borderVisible: false, wickUpColor: "#2ee59d", wickDownColor: "#ff5370"});
let linhas = [], par = null, iv = "5m", posAtual = null, ultimoPar = null;
function marcar(p) {
  linhas.forEach(l => velas.removePriceLine(l)); linhas = [];
  if (!p) return;
  const add = (preco, cor, txt, est = 0) => preco && linhas.push(velas.createPriceLine({price: +preco, color: cor, lineWidth: 1, lineStyle: est, axisLabelVisible: true, title: txt}));
  add(p.entrada, "#c9d1d9", "entrada", 2); add(p.stop, "#ff5370", "stop"); add(p.alvo, "#2ee59d", "alvo");
}
async function carregarVelas() {
  if (!par) return;
  try {
    const d = await j(`/api/candles?par=${par}&int=${iv}`);
    if (!Array.isArray(d)) return;
    const ult = d.length ? d[d.length - 1][4] : 1, casas = ult >= 1000 ? 1 : ult >= 1 ? 4 : Math.min(10, Math.ceil(-Math.log10(ult)) + 3);
    velas.applyOptions({priceFormat: {type: "price", precision: casas, minMove: Math.pow(10, -casas)}});
    velas.setData(d.map(x => ({time: x[0], open: x[1], high: x[2], low: x[3], close: x[4]})));
    if (ultimoPar !== par + iv) { cg.timeScale().fitContent(); ultimoPar = par + iv; }
    const u = d[d.length - 1], a = d[Math.max(0, d.length - 13)];
    const p = posAtual;
    $("leg").innerHTML = `<div><b>${par.replace("USDT", "")}</b><span class="n">${px(u[4])}</span> <span class="${cl(u[4] - a[4])}">${sin((u[4] / a[4] - 1) * 100)}% em 12 velas</span></div>`
      + (p ? `<div class="ln"><span class="f">entrada <span class="n">${px(p.entrada)}</span></span><span class="r">stop ${px(p.stop)}</span>${p.alvo ? `<span class="g">alvo ${px(p.alvo)}</span>` : ""}<span class="${cl(p.resultado)}">${sin(p.resultado, 3)} US$</span></div>` : '<div class="ln f">sem posição nesta moeda</div>');
  } catch (e) {}
}
$("ivs").onclick = ev => { const i = ev.target.dataset.i; if (!i) return; iv = i; document.querySelectorAll(".iv").forEach(x => x.classList.toggle("on", x.dataset.i === i)); carregarVelas(); };

// ---------- curva das carteiras ----------
const ce = LW.createChart($("ce"), {...tema, autoSize: true, rightPriceScale: {borderColor: "#1c232c", scaleMargins: {top: .15, bottom: .1}}, timeScale: {...tema.timeScale, visible: false}, handleScroll: false, handleScale: false});
const sb = ce.addSeries(LW.LineSeries, {color: "#2ee59d", lineWidth: 2, priceLineVisible: false});
const sp = ce.addSeries(LW.LineSeries, {color: "#ff9e64", lineWidth: 2, priceLineVisible: false});
sb.createPriceLine({price: 10, color: "#3a434d", lineStyle: 2, lineWidth: 1, axisLabelVisible: false, title: "início"});
const serie = c => { const m = new Map(); (c || []).forEach(p => m.set(Math.round(p[0]), p[1])); return [...m].sort((a, b) => a[0] - b[0]).map(([time, value]) => ({time, value})); };

function escolher(p) { posAtual = p.pos || null; if (par !== p.par) { par = p.par; } marcar(posAtual); carregarVelas(); desenharChips(); }
let chipsDados = [];
function desenharChips() {
  $("chips").innerHTML = chipsDados.map((c, i) => `<span class="chip ${c.par === par ? "on" : ""}" data-k="${i}">${esc(c.par.replace("USDT", ""))}${c.pos ? `<small class="${cl(c.pos.resultado)}">${sin(c.pos.resultado, 3)}</small>` : ""}</span>`).join("");
}
$("chips").onclick = ev => { const k = ev.target.closest(".chip")?.dataset.k; if (k != null) escolher(chipsDados[k]); };

function desenhar(d) {
  const cart = d.carteira || {}, pump = d.pump || {}, cmd = (d.motor || {}).comando || {}, est = (d.motor || {}).estado || {};
  const pb = cart.patrimonio, pp = pump.patrimonio, tot = (pb || 0) + (pp || 0);
  $("kb").textContent = usd(pb); $("kbv").innerHTML = `<span class="${cl(pb - 10)}">${sin((pb / 10 - 1) * 100, 1)}%</span>`;
  $("kp").textContent = usd(pp); $("kpv").innerHTML = `<span class="${cl(pp - 10)}">${sin((pp / 10 - 1) * 100, 1)}%</span>`;
  $("kt").textContent = usd(tot); $("ktv").innerHTML = `<span class="${cl(tot - 20)}">${sin(tot - 20)}</span>`;
  const velho = Date.now() / 1000 - (est.t || 0) > 180;
  $("km").innerHTML = velho ? '<span class="r">PARADO</span>' : cmd.ligado === false ? '<span class="r">DESLIGADO</span>' : `<span class="g">ligado</span> <span class="f" style="font-weight:400">· ${cmd.modo === "agente" ? "Operador decide" : "regras"}</span>`;
  $("kms").textContent = `Motor · ${est.abertas ?? 0}/${cmd.max_pos ?? "—"} · ciclo ${ha(est.t)}`;
  $("hora").innerHTML = new Date().toLocaleTimeString("pt-BR") + "<br>ao vivo · 5 s";

  // posições
  const ab = (cart.abertas || []).map(p => ({onde: "BingX", par: p.moeda, nome: p.moeda.replace("USDT", ""), lado: p.lado, entrada: p.entrada, stop: p.stop, alvo: p.alvo, resultado: p.resultado, desde: p.desde, motivo: p.motivo}));
  const abp = (pump.abertas || []).map(p => ({onde: "pump", nome: p.simbolo, lado: "compra", resultado: p.resultado ?? p.resultado_aberto, desde: p.t, motivo: p.motivo}));
  $("npos").innerHTML = `${ab.length + abp.length} abertas`;
  $("lpos").innerHTML = (ab.length + abp.length) ? `<table><tr><th style="width:22%">moeda</th><th style="width:17%">lado</th><th class="d" style="width:18%">resultado</th><th style="width:12%">há</th><th>tese</th></tr>`
    + ab.concat(abp).map((p, i) => `<tr class="${p.par ? "click" : ""}" data-par="${p.par || ""}"><td><b>${esc(p.nome)}</b> <span class="f">${p.onde}</span></td><td><span class="lado ${p.lado === "compra" ? "c" : "v"}">${p.lado === "compra" ? "▲ compra" : "▼ venda"}</span></td><td class="d n ${cl(p.resultado)}">${sin(p.resultado, 3)}</td><td class="f">${ha(p.desde)}</td><td class="f" title="${esc(p.motivo)}">${esc(String(p.motivo || "").replace(/^\[[^\]]*\]\s*/, ""))}</td></tr>`).join("") + "</table>"
    : '<div class="vazio">Nenhuma posição aberta. O Operador espera uma ideia clara.</div>';
  document.querySelectorAll("#lpos tr.click").forEach(tr => tr.onclick = () => { const c = chipsDados.find(x => x.par === tr.dataset.par); if (c) escolher(c); });

  // chips do gráfico: as abertas da BingX + BTC
  chipsDados = ab.map(p => ({par: p.par, pos: p})).concat(ab.some(p => p.par === "BTCUSDT") ? [] : [{par: "BTCUSDT", pos: null}]);
  if (!par || !chipsDados.some(c => c.par === par)) { escolher(chipsDados[0]); } else { posAtual = (chipsDados.find(c => c.par === par) || {}).pos || null; marcar(posAtual); desenharChips(); }

  // operações fechadas
  const fe = (cart.fechadas || []).map(x => ({t: x.t, onde: "BingX", nome: x.moeda.replace("USDT", ""), lado: x.lado, r: x.resultado, m: x.motivo}))
    .concat((pump.fechadas || []).map(x => ({t: x.saida_t, onde: "pump", nome: x.simbolo, lado: "compra", r: x.resultado, m: x.motivo_saida}))).sort((a, b) => b.t - a.t);
  const h24 = fe.filter(x => Date.now() / 1000 - x.t < 86400), s24 = h24.reduce((s, x) => s + (x.r || 0), 0), g24 = h24.filter(x => x.r > 0).length;
  $("k24").innerHTML = `<span class="${cl(s24)}">${sin(s24)}</span>`; $("k24v").innerHTML = `<span class="f">${h24.length} ops · ${g24} ganhas</span>`;
  $("placar").textContent = `${fe.length} no total`;
  $("lfe").innerHTML = `<table><tr><th style="width:13%">hora</th><th style="width:24%">moeda</th><th class="d" style="width:16%">resultado</th><th>saída</th></tr>`
    + fe.slice(0, 30).map(x => `<tr><td class="f">${hm(x.t)}</td><td><b>${esc(x.nome)}</b> <span class="f">${x.onde}</span></td><td class="d n ${cl(x.r)}">${sin(x.r, 3)}</td><td class="f" title="${esc(x.m)}">${esc(x.m)}</td></tr>`).join("") + "</table>";

  // equipe
  const ags = [...(d.fluxo || []), ...(d.apoio || [])];
  $("nag").textContent = ags.filter(a => a.ultimo && Date.now() / 1000 - a.ultimo.t < 900).length + " ativos em 15 min";
  $("lag").innerHTML = ags.map(a => { const u = a.ultimo || {}, on = u.t && Date.now() / 1000 - u.t < 900;
    return `<div class="ag"><span class="dot ${on ? "on" : ""}"></span><span class="av">${a.avatar || "•"}</span><div class="tx"><b>${esc(a.nome)}</b>${u.conf ? `<span class="cf ${u.conf}">${u.conf}</span>` : ""}<span class="ul" title="${esc(u.texto)}">${esc(u.texto || PAPEL[a.id] || "")}</span></div><span class="q">${u.t ? ha(u.t) : ""}<br>${esc(PAPEL[a.id] || "")}</span></div>`; }).join("");

  // conversa
  $("lcanal").innerHTML = (d.canal || []).slice(0, 30).map(m => `<div class="msg" title="${esc(m.texto)}"><span class="h">${hm(m.t)}</span><b>${m.de_avatar || ""} ${esc(m.de_nome || m.de)}</b><span class="f"> → ${esc(m.para_nome || m.para)}:</span> ${esc(m.texto)}</div>`).join("");

  // curva
  sb.setData(serie(d.curva)); sp.setData(serie(pump.curva)); ce.timeScale().fitContent();
}

async function btc() {
  try { const d = await j("/api/candles?par=BTCUSDT&int=5m"); if (Array.isArray(d) && d.length > 13) { const u = d[d.length - 1][4], a = d[d.length - 13][4];
    $("btc").textContent = "$" + u.toLocaleString("pt-BR", {maximumFractionDigits: 0}); $("btcv").innerHTML = `<span class="${cl(u - a)}">${sin((u / a - 1) * 100)}% 1h</span>`; } } catch (e) {}
}
async function ciclo() { try { const d = await j("/api/vivo"); if (!d.erro) desenhar(d); } catch (e) {} setTimeout(ciclo, 5000); }
setInterval(carregarVelas, 15000); setInterval(btc, 30000);
let versaoPagina = null;
async function cicloVersao() { try { const v = (await j("/api/versao")).versao; if (versaoPagina && v !== versaoPagina) location.reload(); versaoPagina = v; } catch (e) {} setTimeout(cicloVersao, 20000); }
ciclo(); btc(); cicloVersao();
</script>
</body>
</html>
