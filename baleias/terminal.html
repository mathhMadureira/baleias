<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baleias — mesa ao vivo</title>
<style>
/* 27/11 (dono: "faça tudo caber em uma única tela"): sem abas, sem rolagem da página; cada quadro mostra só o que cabe nele */
:root{--bg:#050807;--card:#0b1210;--borda:#16231e;--txt:#d7eee2;--fraco:#6f8a7d;--verde:#22e07a;--verm:#ff5c6c;--amar:#f5c451}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:grid;grid-template-rows:auto 1fr;height:100dvh;padding:8px;gap:8px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--verde)}.neg{color:var(--verm)}.fr{color:var(--fraco)}
header{display:grid;grid-template-columns:auto repeat(4,1fr) auto;gap:8px;align-items:stretch}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;padding:0 6px}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--verde);box-shadow:0 0 10px var(--verde)}
.k{background:var(--card);border:1px solid var(--borda);border-radius:10px;padding:6px 10px;min-width:0}
.k small{display:block;color:var(--fraco);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k b{font-size:20px;font-weight:800}
.k span{font-size:12px;margin-left:6px}
.hora{color:var(--fraco);font-size:11px;align-self:center;text-align:right;padding-right:4px}
main{display:grid;grid-template-columns:1.05fr 1.25fr 1fr;grid-template-rows:1fr 1fr;gap:8px;min-height:0}
section{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:8px 10px;min-height:0;overflow:hidden;display:flex;flex-direction:column}
section h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fraco);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.lista{overflow:hidden;flex:1;min-height:0}
.lin{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px solid #0f1916;white-space:nowrap;overflow:hidden}
.lin:last-child{border-bottom:0}
.lin .t{color:var(--fraco);font-size:11px;flex:none;width:38px}
.lin .x{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.lin .v{flex:none;font-weight:700}
#agentes{grid-row:1 / span 2;grid-column:2}
#agentes .lista{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:6px}
.ag{border:1px solid var(--borda);border-radius:10px;padding:6px 8px;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.ag .n{display:flex;gap:6px;align-items:center;font-weight:700}
.ag .n em{font-style:normal;font-size:16px}
.ag .c{color:var(--fraco);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag .u{font-size:12px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;flex:1}
.ag .q{font-size:10px;color:var(--fraco)}
.ag.vivo{border-color:#1f5c3d;box-shadow:inset 0 0 0 1px #0f3320}
.ag.dorme{opacity:.6}
.badge{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--borda);color:var(--fraco)}
.badge.alta{color:var(--verde);border-color:#1f5c3d}.badge.média{color:var(--amar);border-color:#5c4a1f}.badge.baixa{color:var(--fraco)}
svg{width:100%;flex:1;min-height:0}
.leg{display:flex;gap:10px;font-size:11px;color:var(--fraco)}
@media (max-width:820px){
  body{padding:6px;gap:6px;font-size:12px}
  header{grid-template-columns:repeat(2,1fr)}
  .logo,.hora{display:none}
  .k b{font-size:16px}
  main{grid-template-columns:1fr 1fr;grid-template-rows:1.1fr 1.3fr .9fr}
  #agentes{grid-row:2;grid-column:1 / span 2}
  #agentes .lista{grid-template-columns:repeat(4,1fr)}
  .ag .u{-webkit-line-clamp:2;font-size:11px}
  #curva{display:none}
}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>Baleias</div>
  <div class="k"><small>BingX (demonstração)</small><b class="num" id="kb">—</b><span id="kbp"></span></div>
  <div class="k"><small>pump.fun (papel)</small><b class="num" id="kp">—</b><span id="kpp"></span></div>
  <div class="k"><small>Total das duas carteiras</small><b class="num" id="kt">—</b><span id="ktp"></span></div>
  <div class="k"><small id="kms">Motor</small><b id="km" style="font-size:15px">—</b></div>
  <div class="hora" id="hora">—</div>
</header>
<main>
  <section id="posicoes"><h2>Posições abertas <span id="npos"></span></h2><div class="lista" id="lpos"></div></section>
  <section id="agentes"><h2>Equipe trabalhando <span id="nag"></span></h2><div class="lista" id="lag"></div></section>
  <section id="conversa"><h2>Conversa da equipe</h2><div class="lista" id="lcanal"></div></section>
  <section id="curva"><h2>Carteiras <span class="leg"><span class="pos">■ BingX</span><span style="color:#fb923c">■ pump.fun</span></span></h2><svg id="svg" preserveAspectRatio="none"></svg></section>
  <section id="fechadas"><h2>Últimas operações <span id="placar"></span></h2><div class="lista" id="lfe"></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const j = async u => (await fetch(u, {cache: "no-store"})).json();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd = (v, d = 2) => (v == null || isNaN(v)) ? "—" : (v < 0 ? "−" : "") + "US$ " + Math.abs(v).toFixed(d);
const sin = (v, d = 2) => (v == null || isNaN(v)) ? "—" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d);
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "fr";
const hm = t => t ? new Date(t * 1000).toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"}) : "";
const ha = t => { if (!t) return ""; const s = Date.now() / 1000 - t; return s < 90 ? "agora" : s < 3600 ? Math.round(s / 60) + " min" : s < 86400 ? Math.round(s / 3600) + " h" : Math.round(s / 86400) + " d"; };
// quem roda no relógio e quem acorda por evento (27/11)
const PAPEL = {laboratorio: ["decide cada operação na BingX", "a cada 3 min"], memecoins: ["decide cada operação na pump.fun", "a cada 3 min"],
  cacador: ["leva ideias com tese ao Operador", "por evento: oportunidade rara"], guardiao: ["segunda opinião; manda sair", "por evento: posição perdendo"],
  treinador: ["uma lição por operação fechada", "por evento: operação fechou"], engenheiro: ["diagnostica erro e parada", "por evento: algo parou"],
  minerador: ["ganhos grátis e seguros", "rotina diária"], baleias: ["chefe: monta e melhora o sistema", "quando o dono pede"]};

function curva(bx, pp) {
  const svg = $("svg"), W = 600, H = 200;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const todos = [...bx, ...pp];
  if (todos.length < 2) { svg.innerHTML = ""; return; }
  const t0 = Math.min(...todos.map(p => p[0])), t1 = Math.max(...todos.map(p => p[0]));
  const v0 = Math.min(...todos.map(p => p[1]), 10) * 0.98, v1 = Math.max(...todos.map(p => p[1]), 10) * 1.02;
  const X = t => (t - t0) / Math.max(1, t1 - t0) * W, Y = v => H - (v - v0) / Math.max(1e-9, v1 - v0) * H;
  const path = (s, c) => s.length > 1 ? `<polyline fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke" points="${s.map(p => X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" ")}"/>` : "";
  svg.innerHTML = `<line x1="0" x2="${W}" y1="${Y(10)}" y2="${Y(10)}" stroke="#2a3a33" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>`
    + `<text x="4" y="${Y(10) - 4}" fill="#6f8a7d" font-size="11">US$ 10 (início)</text>` + path(pp, "#fb923c") + path(bx, "#22e07a");
}

function desenhar(d) {
  const cart = d.carteira || {}, pump = d.pump || {}, cmd = (d.motor || {}).comando || {}, est = (d.motor || {}).estado || {};
  const pb = cart.patrimonio, pp = pump.patrimonio, cb = cart.capital || 10, cp = pump.capital || 10;
  $("kb").textContent = usd(pb); $("kb").className = "num " + cls(pb - cb); $("kbp").innerHTML = `<span class="${cls(pb - cb)}">${sin((pb / cb - 1) * 100, 1)}%</span>`;
  $("kp").textContent = usd(pp); $("kp").className = "num " + cls(pp - cp); $("kpp").innerHTML = `<span class="${cls(pp - cp)}">${sin((pp / cp - 1) * 100, 1)}%</span>`;
  const tot = (pb || 0) + (pp || 0), ct = cb + cp;
  $("kt").textContent = usd(tot); $("kt").className = "num " + cls(tot - ct); $("ktp").innerHTML = `<span class="${cls(tot - ct)}">${sin(tot - ct)} de US$ ${ct.toFixed(0)}</span>`;
  const velho = Date.now() / 1000 - (est.t || 0) > 180;
  $("km").innerHTML = velho ? '<span class="neg">PARADO</span>' : cmd.ligado === false ? '<span class="neg">DESLIGADO</span>' : `<span class="pos">ligado</span> <span class="fr">· ${cmd.modo === "agente" ? "o Operador decide" : "regras"}</span>`;
  $("kms").textContent = `Motor · ${est.abertas ?? 0}/${cmd.max_pos ?? "—"} posições · ciclo ${ha(est.t)}`;
  $("hora").innerHTML = new Date().toLocaleTimeString("pt-BR") + "<br>atualiza a cada 5 s";

  // posições abertas (BingX + pump.fun)
  const ab = (cart.abertas || []).map(p => ({onde: "BingX", nome: p.moeda.replace("USDT", ""), lado: p.lado, res: p.resultado, desde: p.desde, motivo: p.motivo}))
    .concat((pump.abertas || []).map(p => ({onde: "pump", nome: p.simbolo, lado: "compra", res: p.resultado ?? p.resultado_aberto, desde: p.t, motivo: p.motivo})));
  $("npos").textContent = ab.length ? ab.length + " abertas" : "";
  $("lpos").innerHTML = ab.length ? ab.map(p => `<div class="lin"><span class="t">${p.onde}</span><span class="x"><b>${esc(p.nome)}</b> <span class="fr">${p.lado} · ${ha(p.desde)} · ${esc(String(p.motivo || "").replace(/^\[[^\]]*\]\s*/, ""))}</span></span><span class="v num ${cls(p.res)}">${sin(p.res, 3)}</span></div>`).join("")
    : '<div class="fr" style="padding:6px 0">Nenhuma posição aberta. Os agentes esperam uma ideia clara.</div>';

  // equipe: cada agente, o que fez por último e quando
  const ags = [...(d.fluxo || []), ...(d.apoio || [])];
  $("nag").textContent = ags.filter(a => a.ultimo && Date.now() / 1000 - a.ultimo.t < 900).length + " ativos nos últimos 15 min";
  $("lag").innerHTML = ags.map(a => {
    const u = a.ultimo || {}, vivo = u.t && Date.now() / 1000 - u.t < 900, pap = PAPEL[a.id] || [a.cargo, ""];
    return `<div class="ag ${vivo ? "vivo" : "dorme"}"><div class="n"><em>${a.avatar || "•"}</em>${esc(a.nome)}${u.conf ? `<span class="badge ${u.conf}">${u.conf}</span>` : ""}</div>
      <div class="c">${esc(pap[0])}</div><div class="u">${esc(u.texto || "ainda sem registro")}</div><div class="q">${u.t ? ha(u.t) : ""} · ${esc(pap[1])}</div></div>`;
  }).join("");

  // conversa
  $("lcanal").innerHTML = (d.canal || []).slice(0, 18).map(m => `<div class="lin"><span class="t">${hm(m.t)}</span><span class="x"><b>${m.de_avatar || ""} ${esc(m.de_nome || m.de)}</b><span class="fr"> → ${esc(m.para_nome || m.para)}</span> ${esc(m.texto)}</span></div>`).join("");

  // últimas operações (as duas carteiras, mais novas primeiro)
  const fe = (cart.fechadas || []).map(x => ({t: x.t, onde: "BingX", nome: x.moeda.replace("USDT", ""), r: x.resultado, m: x.motivo}))
    .concat((pump.fechadas || []).map(x => ({t: x.saida_t, onde: "pump", nome: x.simbolo, r: x.resultado, m: x.motivo_saida})))
    .sort((a, b) => b.t - a.t);
  const hoje = fe.filter(x => Date.now() / 1000 - x.t < 86400), ganhas = hoje.filter(x => x.r > 0).length, soma = hoje.reduce((s, x) => s + (x.r || 0), 0);
  $("placar").innerHTML = hoje.length ? `24 h: ${hoje.length} ops · ${ganhas} ganhas · <span class="${cls(soma)}">${sin(soma)}</span>` : "";
  $("lfe").innerHTML = fe.slice(0, 16).map(x => `<div class="lin"><span class="t">${hm(x.t)}</span><span class="x"><span class="fr">${x.onde}</span> <b>${esc(x.nome)}</b> <span class="fr">${esc(x.m)}</span></span><span class="v num ${cls(x.r)}">${sin(x.r, 3)}</span></div>`).join("");

  curva(d.curva || [], (pump.curva || []));
}

async function ciclo() {
  try { const d = await j("/api/vivo"); if (!d.erro) desenhar(d); } catch (e) {}
  setTimeout(ciclo, 5000);
}
let versaoPagina = null;
async function cicloVersao() {
  try { const v = (await j("/api/versao")).versao; if (versaoPagina && v !== versaoPagina) location.reload(); versaoPagina = v; } catch (e) {}
  setTimeout(cicloVersao, 20000);
}
ciclo(); cicloVersao();
</script>
</body>
</html>
