<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baleias · Equipe ao vivo</title>
<style>
:root { --bg:#f4f6f8; --card:#ffffff; --line:#e7ebef; --txt:#0f1720; --mut:#6b7785; --dim:#a3adb8;
  --up:#16a34a; --down:#e11d48; --gold:#d97706; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.up { color:var(--up); } .down { color:var(--down); } .mut { color:var(--mut); }
.app { max-width:760px; margin:0 auto; padding:14px 14px 40px; }
header { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.logo { width:40px; height:40px; border-radius:12px; background:#0f1720; color:#fff; display:grid; place-items:center; font-size:22px; }
.tt b { font-size:20px; display:block; line-height:1.1; } .tt span { font-size:12px; color:var(--mut); }
.live { margin-left:auto; font:600 12px system-ui; color:var(--up); display:flex; align-items:center; gap:6px; }
.live i { width:8px; height:8px; border-radius:50%; background:var(--up); box-shadow:0 0 0 3px #16a34a33; animation:bat 1.6s infinite; }
@keyframes bat { 50% { box-shadow:0 0 0 6px #16a34a00; } }
nav { display:flex; gap:4px; margin:0 0 8px; } nav button { border:0; background:none; color:var(--mut); font:600 12px system-ui; padding:6px 10px; border-radius:8px; cursor:pointer; }
nav button.ativo { background:#0f1720; color:#fff; }
.fita { display:flex; gap:18px; overflow-x:auto; white-space:nowrap; font:12px var(--mono); padding:6px 2px 10px; scrollbar-width:none; }
.fita span b { margin-right:5px; } .fita i { font-style:normal; }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:12px; box-shadow:0 1px 2px #0000000a; }
.eq-top { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--mut); }
.mult { font:800 13px var(--mono); background:#16a34a; color:#fff; padding:4px 10px; border-radius:10px; }
.mult.neg { background:var(--down); }
.eq { font:800 46px var(--mono); letter-spacing:-.02em; margin:4px 0 0; } .eq small { font-size:24px; color:var(--mut); }
.eq-sub { display:flex; justify-content:space-between; font:600 14px var(--mono); }
.meta-l { display:flex; justify-content:space-between; font:12px var(--mono); color:var(--mut); margin:14px 0 5px; }
.barra { height:8px; background:#eef2f5; border-radius:6px; overflow:hidden; } .barra i { display:block; height:100%; background:linear-gradient(90deg,#16a34a,#22c55e); border-radius:6px; transition:width .6s; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; } .chip { font:600 11.5px system-ui; padding:5px 10px; border-radius:20px; background:#f1f5f9; color:#334155; }
.chip.ok { background:#dcfce7; color:#15803d; } .chip.al { background:#fef3c7; color:#b45309; } .chip.no { background:#ffe4e6; color:#be123c; }
.tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
.tile { background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 12px; } .tile span { display:block; font:600 10.5px system-ui; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; }
.tile b { font:800 17px var(--mono); }
.ago { font:10.5px var(--mono); color:var(--dim); display:block; }
.curva { margin-top:10px; }
.curva svg { width:100%; height:70px; display:block; }
.desk-h { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; } .desk-h b { font-size:17px; } .desk-h span { font-size:12px; color:var(--mut); }
.ag { display:grid; grid-template-columns:34px 110px 1fr auto; gap:10px; align-items:center; padding:8px 4px; border-top:1px solid var(--line); }
.ag:first-of-type { border-top:0; }
.ico { width:32px; height:32px; border-radius:10px; display:grid; place-items:center; font-size:16px; position:relative; }
.ag.on .ico::after { content:""; position:absolute; inset:-3px; border-radius:12px; border:2px solid currentColor; opacity:.5; animation:pul 1.4s ease-out infinite; }
@keyframes pul { from { transform:scale(.9); opacity:.7 } to { transform:scale(1.25); opacity:0 } }
.nm b { display:block; font-size:13.5px; } .nm span { font-size:11px; color:var(--mut); }
.agora { font-size:12px; color:#334155; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.pill { font:700 11.5px var(--mono); padding:4px 9px; border-radius:20px; white-space:nowrap; }
.log { font:12.5px var(--mono); max-height:330px; overflow-y:auto; }
.ln { display:flex; gap:8px; padding:5px 0; border-top:1px solid #f1f3f5; align-items:flex-start; }
.ln:first-child { border-top:0; } .ln .dot { width:7px; height:7px; border-radius:50%; margin-top:6px; flex:none; }
.ln .h { color:var(--dim); flex:none; } .ln .tg { font-weight:800; flex:none; } .ln .tx { color:#334155; font-family:system-ui; font-size:12.5px; }
.ln.novo { animation:ch 2.5s ease-out; } @keyframes ch { from { background:#dcfce7 } to { background:transparent } }
.pos-l { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:8px; font:13px var(--mono); }
.pos-l span { display:block; font:10.5px system-ui; color:var(--mut); }
table { width:100%; border-collapse:collapse; font:12.5px var(--mono); } td, th { padding:6px 4px; text-align:right; border-top:1px solid var(--line); }
th { font:600 10.5px system-ui; color:var(--mut); text-transform:uppercase; border-top:0; } .e { text-align:left; }
.toast { position:fixed; top:14px; left:50%; transform:translate(-50%,-140%); background:#fff; border:1px solid var(--line); border-radius:16px; padding:10px 16px;
  box-shadow:0 10px 30px #0000002a; display:flex; gap:12px; align-items:center; z-index:9; transition:transform .5s; min-width:300px; }
.toast.show { transform:translate(-50%,0); } .toast b { font-size:14px; } .toast .v { margin-left:auto; font:800 20px var(--mono); }
.aba { display:none; } .aba.ativa { display:block; }
iframe { width:100%; height:calc(100vh - 140px); border:0; border-radius:14px; background:#fff; }
.placar { display:grid; gap:10px; } .hip { background:#fff; border:1px solid var(--line); border-left:4px solid var(--dim); border-radius:12px; padding:10px 12px; }
.hip.aprovada { border-left-color:var(--up); } .hip.reprovada { border-left-color:var(--down); } .hip .p { color:var(--mut); font-size:13px; }
.vazio { color:var(--mut); font-size:13px; padding:6px 0; }
@media (max-width:560px) { .ag { grid-template-columns:32px 1fr auto; } .agora { grid-column:2 / 4; grid-row:2; } .eq { font-size:38px; } }
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🐋</div><div class="tt"><b>Baleias</b><span id="sub">equipe · carteira única</span></div>
  <span class="live" id="online"><i></i>Live</span><span id="pontos" style="display:none"></span><span id="relogio" style="display:none"></span></header>
<nav><button data-aba="mesa" class="ativo">Equipe</button><button data-aba="mercado">Mercado</button><button data-aba="lab">Laboratório</button></nav>
<div class="fita" id="fita"></div>

<section class="aba ativa" id="aba-mesa">
  <div class="card">
    <div class="eq-top"><span id="eq-info">Carteira</span><span class="mult" id="mult">1,00×</span></div>
    <div class="eq" id="eq">US$ —</div>
    <div class="eq-sub"><span id="eq-var">—</span><span class="mut" id="wl"></span></div>
    <div class="curva" id="curva"></div>
    <div class="meta-l"><span>meta US$ 10 → US$ 20</span><span id="meta-p">0%</span></div><div class="barra"><i id="meta-b" style="width:0%"></i></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="tiles"><div class="tile"><span>acerto</span><b id="t-ac">—</b></div><div class="tile"><span>melhor</span><b id="t-me">—</b></div><div class="tile"><span>pior</span><b id="t-pi">—</b></div><div class="tile"><span>em aberto</span><b id="t-ab">—</b></div></div>

  <div class="card">
    <div class="desk-h"><b id="desk-t">Mesa · agentes</b><span id="desk-n"></span></div>
    <div id="desk"></div>
  </div>

  <div class="card" id="pos-card">
    <div class="desk-h"><b>Posição</b><span id="pos-t"></span></div>
    <div id="pos"></div>
  </div>

  <div class="card">
    <div class="desk-h"><b>Logger</b><span id="log-n"></span></div>
    <div class="log" id="log"></div>
  </div>

  <div class="card">
    <div class="desk-h"><b>Operações</b><span id="fe-t"></span></div>
    <div id="fe"></div>
  </div>
</section>
<section class="aba" id="aba-mercado"><iframe id="frame-mercado" title="Mercado"></iframe></section>
<section class="aba" id="aba-lab"><div class="placar" id="placar"></div></section>
</div>
<div class="toast" id="toast"><div class="logo" style="width:34px;height:34px;font-size:18px">🐋</div><div><div class="mut" style="font-size:11px" id="to-h"></div><b id="to-t"></b><div class="mut" style="font-size:12px" id="to-s"></div></div><div class="v" id="to-v"></div></div>
<script>

const $ = (id) => document.getElementById(id);
const FUSO_BR = "America/Sao_Paulo";
const fmt = (x, d = 2) => x == null || isNaN(x) ? "—" : (+x).toLocaleString("pt-BR", {minimumFractionDigits: d, maximumFractionDigits: d});
const sn = (x, d = 2) => x == null || isNaN(x) ? "—" : (x > 0 ? "+" : x < 0 ? "−" : "") + fmt(Math.abs(x), d);
const px = (x) => x == null || !x ? "—" : x >= 1000 ? fmt(x, 1) : x >= 1 ? fmt(x, 4) : (+x).toPrecision(4);
const cor = (x) => x > 0.00005 ? "up" : x < -0.00005 ? "down" : "";
const esc = (x) => String(x ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const hora = (t) => new Date(t * 1000).toLocaleString("pt-BR", {timeZone: FUSO_BR, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});
const hm = (t) => new Date(t * 1000).toLocaleTimeString("pt-BR", {timeZone: FUSO_BR, hour: "2-digit", minute: "2-digit"});
function ha(t) {
  if (!t) return "—";
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 90) return Math.round(s) + " s";
  if (s < 5400) return Math.round(s / 60) + " min";
  if (s < 172800) return Math.floor(s / 3600) + " h " + String(Math.round(s % 3600 / 60)).padStart(2, "0");
  return Math.round(s / 86400) + " d";
}
const curto = (n) => String(n || "").replace("Baleias (chefe da mesa)", "Chefe · simulado").replace("Baleias (conta de teste)", "Chefe · conta de teste");
async function j(url) { const r = await fetch(url, {cache: "no-store"}); return r.json(); }

// abas
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("ativo", x === b));
  document.querySelectorAll(".aba").forEach(x => x.classList.toggle("ativa", x.id === "aba-" + b.dataset.aba));
  if (b.dataset.aba === "mercado" && !$("frame-mercado").src) $("frame-mercado").src = "/ao-vivo";
  if (b.dataset.aba === "lab") carregarLab();
});

// a aba aberta se recarrega sozinha quando o painel muda
let versaoPagina = null;
async function cicloVersao() {
  try { const v = (await j("/api/versao")).versao; if (versaoPagina && v !== versaoPagina) location.reload(); versaoPagina = v; } catch (e) {}
  setTimeout(cicloVersao, 20000);
}
cicloVersao();


// ---------- painel da equipe (estilo app): /api/vivo ----------
const COR = {cacador:["#2563eb","#dbeafe"], memecoins:["#ea580c","#ffedd5"], treinador:["#4f46e5","#e0e7ff"], laboratorio:["#16a34a","#dcfce7"],
  guardiao:["#9333ea","#f3e8ff"], engenheiro:["#475569","#e2e8f0"], minerador:["#ca8a04","#fef9c3"], baleias:["#0d9488","#ccfbf1"]};
const ORDEM = ["cacador", "memecoins", "treinador", "laboratorio", "guardiao", "engenheiro", "minerador", "baleias"];
let vv = null, vistos = new Set(), primeira = true, ultFech = null;
function pill(a) {
  const m = vv.missao, r = vv.risco || {};
  if (a.id === "laboratorio") return `${m.operacoes} ops · ${vv.carteira.abertas.length} aberta`;
  if (a.id === "guardiao") return r.acao ? r.acao + (r.moeda ? " " + String(r.moeda).replace("USDT", "") : "") : "vigiando";
  if (a.id === "cacador") return `${a.contagem.hoje} rodadas`;
  if (a.id === "memecoins") return `${a.contagem.hoje} buscas`;
  if (a.id === "treinador") return `${a.contagem.hoje} revisões`;
  return `${a.contagem.hoje} hoje`;
}
function svgCurva(p, cap) {
  if (!p || p.length < 2) p = [[Date.now() / 1000 - 3600, cap], [Date.now() / 1000, p && p[0] ? p[0][1] : cap]];
  const W = 600, H = 70, t0 = p[0][0], t1 = Math.max(p[p.length - 1][0], t0 + 1);
  let lo = Math.min(cap, ...p.map(x => x[1])), hi = Math.max(cap, ...p.map(x => x[1])); const m = Math.max((hi - lo) * .15, .05); lo -= m; hi += m;
  const X = t => (t - t0) / (t1 - t0) * W, Y = v => H - (v - lo) / (hi - lo) * H;
  const d = p.map((x, i) => (i ? "L" : "M") + X(x[0]).toFixed(1) + "," + Y(x[1]).toFixed(1)).join("");
  const c = p[p.length - 1][1] >= cap ? "#16a34a" : "#e11d48";
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".25"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${Y(cap)}" y2="${Y(cap)}" stroke="#cbd5e1" stroke-dasharray="4 4"/><path d="${d}L${W},${H}L0,${H}Z" fill="url(#g)"/><path d="${d}" fill="none" stroke="${c}" stroke-width="3" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(p[p.length - 1][0])}" cy="${Y(p[p.length - 1][1])}" r="4" fill="${c}"/></svg>`;
}
function toast(h, t, s, v, c) {
  $("to-h").textContent = h; $("to-t").textContent = t; $("to-s").textContent = s; $("to-v").textContent = v; $("to-v").className = "v " + c;
  $("toast").classList.add("show"); setTimeout(() => $("toast").classList.remove("show"), 6000);
}
function desenhar() {
  const m = vv.missao, c = vv.carteira, f = vv.foco || {};
  const v = m.patrimonio - m.capital, x = m.patrimonio / m.capital;
  $("sub").textContent = `${f.foco && f.foco !== "parado" ? f.foco.toUpperCase() : "PARADO"} · carteira única · meta US$ ${fmt(m.meta, 0)}`;
  $("eq-info").textContent = `Patrimônio · começou com US$ ${fmt(m.capital, 0)}` + (c.corretora ? ` · ${c.corretora}` : "");
  $("mult").textContent = fmt(x, 2) + "×"; $("mult").className = "mult" + (x < 1 ? " neg" : "");
  const [i, d] = fmt(m.patrimonio, 2).split(","); $("eq").innerHTML = `US$ ${i}<small>,${d}</small>`;
  $("eq-var").innerHTML = `<span class="${cor(v)}">${sn(v)} (${sn(v / m.capital * 100, 1)}%)</span>`;
  $("wl").textContent = `${m.ganhos}W / ${m.operacoes - m.ganhos}L`;
  const prog = Math.max(0, Math.min(1, m.progresso));
  $("meta-p").textContent = fmt(prog * 100, 0) + "% do caminho"; $("meta-b").style.width = prog * 100 + "%";
  const cac = vv.desk.find(a => a.id === "cacador"), uc = cac && cac.ultimo ? cac.ultimo.t : null;
  const prox = uc ? Math.max(0, Math.round(uc + 180 - Date.now() / 1000)) : null;
  const viva = uc && Date.now() / 1000 - uc < 900, sem_stop = c.abertas.some(p => !p.stop);
  $("chips").innerHTML = [
    `<span class="chip ${f.foco && f.foco !== "parado" ? "ok" : "no"}">${f.foco && f.foco !== "parado" ? "● foco " + f.foco.toUpperCase() : "⏸ parado"}</span>`,
    `<span class="chip ${viva ? "ok" : "al"}">${viva ? (prox > 0 ? "próxima rodada em ~" + prox + " s" : "rodada em andamento") : "rodada parada há " + ha(uc)}</span>`,
    `<span class="chip">${c.abertas.length ? c.abertas.length + " posição aberta" : "sem posição"}</span>`,
    sem_stop ? `<span class="chip no">🚨 posição sem stop</span>` : (c.abertas.length ? `<span class="chip ok">stop na corretora ✓</span>` : ""),
    vv.risco && vv.risco.acao && vv.risco.acao !== "NADA" ? `<span class="chip ${vv.risco.acao === "SAIR" ? "no" : "ok"}">🛡 ${esc(vv.risco.acao)}</span>` : ""].join("");
  const rs0 = c.fechadas.map(x => x.resultado).filter(r => r != null);
  $("t-ac").textContent = rs0.length ? fmt(m.ganhos / rs0.length * 100, 0) + "%" : "—";
  $("t-me").textContent = rs0.length ? sn(Math.max(...rs0)) : "—"; $("t-me").className = rs0.length ? cor(Math.max(...rs0)) : "";
  $("t-pi").textContent = rs0.length ? sn(Math.min(...rs0)) : "—"; $("t-pi").className = rs0.length ? cor(Math.min(...rs0)) : "";
  const ab = c.abertas.reduce((s_, p) => s_ + (p.resultado || 0), 0);
  $("t-ab").textContent = c.abertas.length ? sn(ab, 3) : "—"; $("t-ab").className = c.abertas.length ? cor(ab) : "";
  $("curva").innerHTML = svgCurva(vv.curva, m.capital);
  // mesa
  const desk = [...vv.desk].sort((a, b) => ORDEM.indexOf(a.id) - ORDEM.indexOf(b.id));
  const on = desk.filter(a => a.ativo).length, rod = (desk.find(a => a.id === "cacador") || {}).contagem || {hoje: 0};
  $("desk-t").textContent = `Mesa · ${desk.length} agentes`; $("desk-n").textContent = `${on} trabalhando · ${rod.hoje} rodadas hoje · ${m.operacoes} operadas`;
  $("desk").innerHTML = desk.map(a => { const [c1, c2] = COR[a.id] || ["#475569", "#e2e8f0"], u = a.ultimo;
    return `<div class="ag ${a.ativo ? "on" : ""}"><div class="ico" style="background:${c2};color:${c1}">${esc(a.avatar)}</div>
      <div class="nm"><b>${esc(a.nome)}</b><span>${esc(a.cargo)}</span><span class="ago">${u ? (a.ativo ? "● " : "") + "há " + ha(u.t) : ""}</span></div>
      <div class="agora" title="${esc(u ? u.texto : "")}">${u ? esc(u.texto) : '<span class="mut">sem registro ainda</span>'}</div>
      <span class="pill" style="background:${c2};color:${c1}">${esc(pill(a))}</span></div>`; }).join("");
  // posição
  $("pos-t").textContent = c.atualizado ? "corretora lida há " + ha(c.atualizado) : "";
  $("pos").innerHTML = c.abertas.length ? c.abertas.map(p => `<div><b style="font-size:16px"><span class="${p.lado === "venda" ? "down" : "up"}">${p.lado === "venda" ? "▼ VENDIDO" : "▲ COMPRADO"}</span> ${esc(String(p.moeda).replace("USDT", ""))}</b>
      <span class="mut" style="font-size:12px"> · há ${ha(p.desde)}${p.alav ? " · " + p.alav + "×" : ""}</span>
      <div class="pos-l"><div><span>entrada → agora</span>${px(p.entrada)} → ${px(p.agora)} <b class="${cor(p.resultado)}">${p.resultado != null ? sn(p.resultado, 3) : ""}</b></div><div><span>stop</span><b class="down">${px(p.stop)}</b></div><div><span>alvo</span><b class="up">${px(p.alvo)}</b></div><div><span>tamanho</span>US$ ${fmt(p.nocional)}</div></div>
      ${vv.risco && vv.risco.motivo && vv.risco.moeda === p.moeda ? `<div class="mut" style="font-size:12px;margin-top:8px">🛡 ${esc(vv.risco.acao)} · ${esc(vv.risco.motivo)}</div>` : ""}</div>`).join("")
    : `<div class="vazio">Sem posição aberta — o operador entra na próxima rodada que aprovar uma entrada.</div>`;
  // logger
  $("log-n").textContent = `${vv.feed.length} registros`;
  $("log").innerHTML = vv.feed.map(x => { const k = x.t + x.agente + x.texto, novo = !primeira && !vistos.has(k); vistos.add(k); const [c1] = COR[x.agente] || ["#475569"];
    return `<div class="ln ${novo ? "novo" : ""}"><i class="dot" style="background:${c1}"></i><span class="h">${hm(x.t)}</span><span class="tg" style="color:${c1}">${esc((x.nome || "").toUpperCase())}:</span><span class="tx">${esc(x.texto)}</span></div>`; }).join("") || `<div class="vazio">Nada registrado ainda.</div>`;
  // operações
  const fe = [...c.fechadas].reverse(), rs = fe.map(x => x.resultado).filter(r => r != null);
  $("fe-t").textContent = rs.length ? `melhor ${sn(Math.max(...rs))} · pior ${sn(Math.min(...rs))}` : "";
  $("fe").innerHTML = fe.length ? `<table><tr><th class="e">hora</th><th class="e">moeda</th><th>entrada</th><th>saída</th><th>resultado</th></tr>` + fe.map(x =>
    `<tr><td class="e mut">${x.t ? hora(x.t) : "—"}</td><td class="e"><span class="${x.lado === "venda" ? "down" : "up"}">${x.lado === "venda" ? "▼" : "▲"}</span> ${esc(String(x.moeda).replace("USDT", ""))}</td><td>${px(x.entrada)}</td><td>${px(x.saida)}</td><td class="${cor(x.resultado)}"><b>${sn(x.resultado, 3)}</b></td></tr>`).join("") + "</table>"
    : `<div class="vazio">Nenhuma operação fechada ainda.</div>`;
  const ult = fe[0];
  if (ult && ultFech !== null && ult.t !== ultFech) toast("BALEIAS · " + hm(ult.t), `${String(ult.moeda).replace("USDT", "")} ${ult.lado} · ${ult.resultado >= 0 ? "lucro" : "perda"}`, ult.motivo, sn(ult.resultado, 2), cor(ult.resultado));
  if (ult) ultFech = ult.t; else if (ultFech === null) ultFech = 0;
  primeira = false;
}
async function ciclo() {
  try { const d = await j("/api/vivo"); if (!d.erro) { vv = d; desenhar(); } } catch (e) {}
  setTimeout(ciclo, 4000);
}
ciclo();
setInterval(() => { if (vv) desenhar(); }, 20000);

// ---------- fita de preços e fontes da máquina ----------
async function cicloFontes() {
  try {
    const d = await j("/api/ao-vivo?desde=999999999&calor=999999999");
    const destaque = ["BTC", "ETH", "SOL", "XRP", "BNB", "DOGE", "PEPE", "SUI", "LINK", "AVAX"];
    const mapaM = Object.fromEntries((d.mercado || []).map(x => [x.s, x]));
    $("fita").innerHTML = destaque.filter(s => mapaM[s]).map(s => `<span><b>${s}</b>${px(mapaM[s].p)} <i class="${cor(mapaM[s].pct)}" style="font-style:normal">${sn(mapaM[s].pct, 2)}%</i></span>`).join("");
    const vivas = Object.values(d.fontes || {}).filter(v => v.ok && d.agora - v.t < 900).length, total = Object.keys(d.fontes || {}).length, ok = total > 0 && vivas === total;
     
    $("pontos").innerHTML = Object.entries(d.fontes || {}).map(([k, v]) => `<span class="ponto ${v.ok && d.agora - v.t < 900 ? "ok" : "mal"}" title="${esc(k + (v.erro ? ": " + v.erro : ""))}"></span>`).join("");
  } catch (e) {  }
  setTimeout(cicloFontes, 3000);
}
cicloFontes();
function relogio() {
  const a = new Date();
  $("relogio").textContent = a.toLocaleTimeString("pt-BR", {timeZone: FUSO_BR}) + " Brasília · " + a.toISOString().slice(11, 19) + " UTC";
}
setInterval(relogio, 1000); relogio();
